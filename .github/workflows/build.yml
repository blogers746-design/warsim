name: Build Android APK
on:
  push:
  workflow_dispatch:
env:
  GODOT_VERSION: "4.3"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK parts
        run: |
          export SDK=/usr/local/lib/android/sdk
          $SDK/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmake;3.10.2.4988404" "ndk;23.2.8568313"
      - name: Install Godot and export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz -d tpl
          mv tpl/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
      - name: Configure Android
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999
          mkdir -p ~/.config/godot
          F=~/.config/godot/editor_settings-${GODOT_VERSION}.tres
          echo '[gd_resource type="EditorSettings" format=3]' > $F
          echo '[resource]' >> $F
          echo "export/android/android_sdk_path = \"/usr/local/lib/android/sdk\"" >> $F
          echo "export/android/java_sdk_path = \"${JAVA_HOME}\"" >> $F
          echo "export/android/debug_keystore = \"${GITHUB_WORKSPACE}/debug.keystore\"" >> $F
          echo "export/android/debug_keystore_user = \"androiddebugkey\"" >> $F
          echo "export/android/debug_keystore_pass = \"android\"" >> $F
          cat $F
      - name: Export APK
        run: |
          mkdir -p build
          if ! godot --headless --import; then echo "import warning"; fi
          godot --headless --export-debug "Android" build/warsim.apk
      - uses: actions/upload-artifact@v4
        with:
          name: warsim-apk
          path: build/warsim.apk
